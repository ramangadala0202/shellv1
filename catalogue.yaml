- name: configure catalogue
  hosts: catalogue
  become: yes

  tasks:
   - name: disable module
     command: dnf module disable nodejs -y

   - name: enable app
     command: dnf module enable nodejs:24 -y

   - name: install package
     package:
      name: nodejs
      state: present

   - name: Create RoboShop system user
     user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"
      create_home: false
      state: present

   - name: Download Catalogue application
     get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
      dest: /tmp/catalogue.zip

   - name: Create application directory
     file:
      path: /app
      state: directory
      owner: roboshop
      group: roboshop

   - name: unzip the package
     ansible.builtin.unarchive:
       src: /tmp/catalogue.zip
       dest: /app
       remote_src: true
       owner: roboshop
       group: roboshop

   - name: Install Catalogue application dependencies
     community.general.npm:
      path: /app
      state: present
   
   - name: configuring repo file
     copy:
      src:  catalogue.repo
      dest: /etc/systemd/system/catalogue.service

   - name: Reload systemd, enable and start Catalogue service
     systemd_service:
      name: catalogue
      daemon_reload: true
      enabled: true
      state: started

   - name: mongoDB repo
     copy: 
      src: mongo1.repo
      dest: /etc/yum.repos.d/mongo.repo

   - name: installation
     package:
      name: mongodb-mongosh
      state: present

   - name: Count products in catalogue database
     ansible.builtin.command:
        argv:
          - mongosh
          - --host
          - "mongodb.ram0202.store"
          - --quiet
          - --eval
          - 'db.getSiblingDB("catalogue").products.countDocuments()'
     register: products_count

   - name: Display number of products
     debug:
        msg: "Number of products: {{ products_count }}"

   - name: Load master data when products collection is empty
     ansible.builtin.shell:
      cmd: "mongosh --host mongodb.ram0202.store < /app/db/master-data.js"
     when: products_count.stdout | trim | int == 0

   - name: Reload systemd, enable and start Catalogue service
     systemd_service:
      name: catalogue
      daemon_reload: true
      enabled: true
      state: restarted
      
