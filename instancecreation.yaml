- name: create ec2 instances
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: ram0202.store
    ami_id: ami-0055977a6e828a4f4
  tasks:
   - name: create ec2
     amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups:
        - roboshop-common
        - "roboshop-{{item}}"
      region: us-east-1
     loop: "{{instances}}"
     when: action=="create"
     register: ec2_output

   - name: create R53 record
     amazon.aws.route53:
      state: present
      zone: "{{domain_name}}"
      record: "{{ item.item }}.{{ domain_name }}"
      type: A
      ttl: 1
      overwrite: true
      value: "{{item.instances[0].private_ip_address }}"
     loop: "{{ec2_output.results}}"
     when: action=="create"
    