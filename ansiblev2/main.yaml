- name: provision infrastructure
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Run infrastructure role
      include_role:
        name: "{{ component }}"

- name: configure {{ component }}
  hosts: "{{ component }}"
  become: yes
  tasks:
    - name: Run configuration role
      include_role:
        name: "{{ component }}"