- name: configure mongodb
  hosts: mongodb
  become: yes
  tasks:
   - name: copy mongodb repo
     copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

   - name: install mongodb
     dnf:
      name: mongodb-org
      state: present
      
   - name: start mongodb
     systemd_service:
       name: mongod
       state: started
       enabled: true

   - name: configure
     replace:
      path: /etc/mongod.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'

  #  - name: Configure MongoDB bind IP
  #    ansible.builtin.replace:
  #       path: /etc/mongod.conf
  #       regexp: '127\.0\.0\.1'
  #       replace: '0.0.0.0'
  #       backup: true

   - name: restart mongodb
     systemd_service:
       name: mongod
       state: restarted
       
     
   

