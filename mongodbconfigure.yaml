- name: configure mongodb
  hosts: mongodb
  become: yes
  tasks:
   - name: copy mongodb repo
     copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

   - name: install mongodb
     dnf:
      name: mongodb-org
      state: present
      
   - name: start mongodb
     systemd_service:
       name: mongod
       state: started
       enabled: true

  #  - name: configure
