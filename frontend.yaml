- name: configure frontend
  hosts: frontend
  become: yes

  tasks:
   - name: disable module
     command: dnf module disable nginx -y

   - name: enable app
     command: dnf module enable nginx:1.26 -y

   - name: install package
     package:
      name: nginx
      state: present

   - name: Reload systemd, enable and start Catalogue service
     systemd_service:
      name: nginx
      enabled: true
      state: started

   - name: Find files and directories inside Nginx HTML directory
     ansible.builtin.find:
      paths: /usr/share/nginx/html
      file_type: any
      hidden: true
      recurse: false
     register: nginx_html_contents

   - name: print
     debug:
      msg: "{{ nginx_html_contents }}"

   - name: Delete
     file:
      path: "{{ item.path }}"
      state: absent
     loop: "{{nginx_html_contents.files}}"

   - name: copy
     template:
      src: frontend.conf.j2
      dest: /etc/nginx/default.d/roboshop.conf
    
   - name: restarted
     service:
      name: nginx
      state: restarted
      
      

