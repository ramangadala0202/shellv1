- name: configure frontend
  hosts: frontend
  become: yes

  tasks:
   - name: disable module
     command: dnf module disable nginx -y

   - name: enable app
     command: dnf module enable nginx:1.26 -y

   - name: install package
     package:
      name: nginx
      state: present

   - name: Reload systemd, enable and start Catalogue service
     systemd_service:
      name: nginx
      enabled: true
      state: started

   - name: Find files and directories inside Nginx HTML directory
     ansible.builtin.find:
      paths: /usr/share/nginx/html
      file_type: any
      hidden: true
      recurse: false
     register: nginx_html_contents
