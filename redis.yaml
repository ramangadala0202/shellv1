- name: redis configure
  hosts: redis
  become: yes

  tasks:
   - name: uninstall package
     package:
      name: redis
      state: absent
   
   - name: disable package
     command: dnf module disable redis -y

   - name: enable package
     command: dnf module enable redis:7 -y

   - name: install package
     package:
      name: redis
      state: present

   - name: configure
     replace:
      path: /etc/redis/redis.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'

   - name: Configure Redis protected mode
     ansible.builtin.lineinfile:
      path: /etc/redis/redis.conf
      regexp: '^\s*#?\s*protected-mode\s+.*$'
      line: 'protected-mode no'
      backup: true
      
   - name: start redis
     systemd_service:
       name: redis
       state: started
       enabled: true
