- name: redis configure
  hosts: redis
  become: yes

  tasks:
   - name: uninstall package
     package:
      name: redis
      state: absent
   
   - name: disable package
     command: dnf module disable redis -y

   - name: enable package
     command: dnf module enable redis:7 -y

   - name: install package
     package:
      name: redis
      state: present

   - name: configure
     replace:
      path: /etc/redis/redis.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'

   - name: configure Redis protected mode
     replace:
        path: /etc/redis/redis.conf
        regexp: '^protected-mode\s+yes'
        replace: 'protected-mode no'
        backup: true
