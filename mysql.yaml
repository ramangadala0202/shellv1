- name: configure mysql
  hosts: mysql
  become: yes

  tasks:
   - name: enable mysql
     systemd_service:
       name: mysql:8.4
       enabled: true

   - name: install mongodb
     dnf:
      name: mysql-server
      state: present

   - name: restart mongodb
     systemd_service:
       name: mysqld
       state: started
       enabled: true