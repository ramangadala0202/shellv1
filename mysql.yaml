- name: configure mysql
  hosts: mysql
  become: yes

  tasks:
   - name: enable mysql
     ansible.builtin.command:
        cmd: dnf module enable mysql:8.4 -y

   - name: install mongodb
     dnf:
      name: mysql-server
      state: present

   - name: restart mongodb
     systemd_service:
       name: mysqld
       state: started
       enabled: true