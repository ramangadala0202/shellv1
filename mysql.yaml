- name: configure mysql
  hosts: mysql
  become: yes

  tasks:
   - name: enable mysql
     ansible.builtin.command:
        cmd: dnf module enable mysql:8.4 -y

   - name: install mongodb
     dnf:
      name: mysql-server
      state: present

   - name: restart mongodb
     systemd_service:
       name: mysqld
       state: started
       enabled: true

   - name: Install Python MySQL dependency
     dnf:
        name: python3-PyMySQL
        state: present

  #  - name: Set MySQL root password
  #    ansible.mysql.mysql_user:
  #       name: root
  #       password: "{{ mysql_root_password }}"
  #       state: present

   - name: set root 
     command: mysql_secure_installation --set-root-pass RoboShop@1