- name: "ping demo"
  hosts: mongoDB #target ansible server itself
  become: true
  vars:
    course: Devops
    Trainer: Ram
  vars_files:
    extra.yaml
  vars_prompt:
    - name=username
      prompt: Please enter username
      private: false
  tasks: # tasks == modules == collections
   - name: "ping localhost"
     ping:
   - name: "print message"
     ansible.builtin.debug:
       msg: "Hello from Ansible"
   - name: "Install Package"
     ansible.builtin.package:
       name: nginx
       state: present
   - name: "start service"
     ansible.builtin.service:
       name: nginx
       state: started
       enabled: yes
   - name: print
     vars:
       course: Linux
     debug:
       msg: "Hi, {{Trainer}}, learning {{course}}"
   - name: files 
     debug:
       msg: "{{name}}, {{class}}"
   - name: prompt
     debug:
       msg: "{{username}}""




