- name: "ping demo"
  hosts: mongoDB #target ansible server itself
  become: true
  tasks: # tasks == modules == collections
   - name: "ping localhost"
     ping:
   - name: "print message"
     ansible.builtin.debug:
       msg: "Hello from Ansible"
   - name: "Install Package"
     ansible.builtin.package:
       name: nginx
       state: present
   - name: "start service"
     ansible.builtin.service:
       name: nginx
       state: started
       enabled: yes




